<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f6">
  <title>Gestión de tareas · Flowcus</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="app-page task-page">
  <section class="workspace">
    <aside class="sidebar">
      <a class="brand" href="tareas.html">FLOWCUS</a>
      <nav class="side-nav" aria-label="Navegación principal">
        <a href="tareas.html">Dashboard</a>
        <a class="selected" href="tareas.html">Tareas</a>
        <a href="tareas.html">Planificación</a>
        <a href="tareas.html">Progreso</a>
      </nav>
      <div class="daily-goal"><div><strong>OBJETIVO DIARIO</strong><strong>3/5 H</strong></div><span><i></i></span></div>
      <button class="logout-button" type="button" id="logout">▷ CERRAR SESIÓN</button>
    </aside>
    <main class="app-main">
      <section class="tasks-view">
        <div class="tasks-top-actions"><a class="top-create" href="crear-tarea.html">Crear</a><div class="profile-status"><span class="profile-avatar" aria-hidden="true">●</span><span>Perfil<br><strong>ACTIVO</strong></span></div></div>
        <div class="tasks-header">
          <h1>GESTIÓN DE TAREAS</h1>
          <div class="task-stats"><span><i></i><b id="planned-count">0 TAREAS PLANIFICADAS</b></span><em></em><span class="cycle-stat">◉&nbsp; 0 Ciclos estim.</span><a class="create-task-button" href="crear-tarea.html">CREAR TAREA</a></div>
        </div>
        <div class="task-controls">
          <div class="filters" role="tablist" aria-label="Filtrar tareas">
            <button class="active" type="button" data-filter="all">TODAS <small>(0)</small></button>
            <button type="button" data-filter="active">En curso <small>(0)</small></button>
            <button type="button" data-filter="done">Completadas <small>(0)</small></button>
            <button class="priority-filter" id="priority-filter" type="button">Prioridad Alta</button>
          </div>
          <div class="search-tools"><input id="task-search" type="search" placeholder="Buscar tarea..."><button type="button" class="filter-icon" aria-label="Filtrar tareas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M7 12h10M10 18h4"/></svg></button></div>
        </div>
        <div class="board-labels"><span>ORDEN DE PRIORIDAD</span><span>ARRASTRA PARA REORGANIZAR</span></div>
        <button class="empty-task" type="button" id="new-task">
          <i class="card-menu" aria-hidden="true">⋮</i><strong>CREAR TAREA</strong><span>Crear tareas para agregarlas a una sesión y<br>comenzar a cumplir tus metas</span>
        </button>
        <p class="tip">TIP: AGRUPA TAREAS SIMILARES EN UN MISMO BLOQUE<br>DE X MIN.</p>
      </section>
    </main>
  </section>
</body>
</html>
